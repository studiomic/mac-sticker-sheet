# 静的コンテンツを GitHub Pages にデプロイするためのシンプルなワークフロー
name: Deploy VitePress site to Pages

on:
  # デフォルトブランチ（main や master）へのプッシュ時に実行
  push:
    branches: [main]

  # Actions タブから手動で実行できるようにする
  workflow_dispatch:

# GitHub Pages へのデプロイに必要なアクセス権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイが複数ある場合、古いものをキャンセルして最新を優先する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ビルドジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # 💡 package.json の内容に関わらず、vitepress とその動作に必要な vue を確実に強制インストールします
        run: |
          npm install
          npm install vitepress vue --save-dev

      - name: Build with VitePress
        run: npx vitepress build docs --config docs/.vitepress/config.mts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
